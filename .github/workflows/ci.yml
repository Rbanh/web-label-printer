name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Type check
        run: npm run check
      
      - name: Build frontend
        run: npm run build
      
      - name: Build Tauri (check only)
        run: cargo check --manifest-path src-tauri/Cargo.toml

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Type check
        run: npm run check
      
      - name: Build frontend
        run: npm run build
      
      - name: Build Tauri (check only)
        run: cargo check --manifest-path src-tauri/Cargo.toml

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Type check
        run: npm run check
      
      - name: Build frontend
        run: npm run build
      
      - name: Build Tauri (check only)
        run: cargo check --manifest-path src-tauri/Cargo.toml
