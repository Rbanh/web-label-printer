name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Web Label Printer ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Build Tauri app
        run: npm run tauri build
      
      - name: Upload DEB
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: src-tauri/target/release/bundle/deb/*.deb
      
      - name: Upload AppImage
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage

  build-linux-flatpak:
    needs: create-release
    runs-on: ubuntu-22.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.phomemo.weblabelprinter.flatpak
          manifest-path: flatpak/com.phomemo.weblabelprinter.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      
      - name: Upload Flatpak
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: com.phomemo.weblabelprinter.flatpak

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Build Tauri app
        run: npm run tauri build
      
      - name: Upload MSI
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: src-tauri/target/release/bundle/msi/*.msi
      
      - name: Upload NSIS
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: src-tauri/target/release/bundle/nsis/*.exe

  build-macos-intel:
    needs: create-release
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Build Tauri app
        run: npm run tauri build --target x86_64-apple-darwin
      
      - name: Upload DMG
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
      
      - name: Upload App
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

  build-macos-arm:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Build Tauri app
        run: npm run tauri build --target aarch64-apple-darwin
      
      - name: Upload DMG
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      
      - name: Upload App
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  publish-release:
    needs: [create-release, build-linux, build-linux-flatpak, build-windows, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          draft: false
